<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Travel Plan | AI TRAVEL PLANNER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="results-page planner-results-page">
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm" id="mainNav">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">AI TRAVEL PLANNER</a>
        <a class="btn btn-outline-light btn-sm" href="index.html#hero">New chat</a>
      </div>
    </nav>

    <main class="py-5 mt-5">
      <div class="container py-4">
        <div class="mb-4">
          <span class="badge text-bg-light border mb-2">AI Planner</span>
          <h1 class="section-title h2 mb-2">Your travel plan</h1>
          <p class="text-secondary mb-0">Itinerary, flights, and hotels from your conversation</p>
        </div>
          <div class="col-lg-8">
            <div class="card border-0 shadow-sm planner-results-panel">
              <div class="card-body p-0">
                <ul class="nav nav-tabs nav-fill planner-tabs" id="plannerResultTabs" role="tablist">
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link active"
                      id="tab-itinerary"
                      data-bs-toggle="tab"
                      data-bs-target="#pane-itinerary"
                      type="button"
                      role="tab"
                    >
                      Itinerary
                    </button>
                  </li>
                </ul>
                <div class="tab-content planner-tab-content p-3 p-md-4">
                  <div class="tab-pane fade show active" id="pane-itinerary" role="tabpanel">
                    <p id="plannerItinerarySummary" class="small text-secondary mb-2"></p>
                    <div id="plannerItineraryBody" class="planner-itinerary-body"></div>
                  </div>
                  <div class="tab-pane fade" id="pane-planner-flights" role="tabpanel">
                    <div id="plannerFlightAlert" class="alert alert-warning d-none small" role="alert"></div>
                    <p id="plannerFlightSummary" class="small text-secondary mb-2"></p>
                    <div id="plannerFlightLoading" class="text-center py-4">
                      <div class="spinner-border text-accent" role="status"></div>
                      <p class="small text-secondary mt-2 mb-0">Searching flights…</p>
                    </div>
                    <div id="plannerFlightList" class="list-group list-group-flush"></div>
                    <p id="plannerFlightEmpty" class="text-secondary small text-center py-4 d-none mb-0">
                      No flights found for this search.
                    </p>
                  </div>
                  <div class="tab-pane fade" id="pane-planner-hotels" role="tabpanel">
                    <div id="plannerHotelAlert" class="alert alert-warning d-none small" role="alert"></div>
                    <p id="plannerHotelSummary" class="small text-secondary mb-2"></p>
                    <div id="plannerHotelLoading" class="text-center py-4">
                      <div class="spinner-border text-accent" role="status"></div>
                      <p class="small text-secondary mt-2 mb-0">Searching hotels…</p>
                    </div>
                    <div id="plannerHotelFilters" class="d-none mb-3"></div>
                    <div id="plannerHotelList" class="list-group list-group-flush"></div>
                    <p id="plannerHotelEmpty" class="text-secondary small text-center py-4 d-none mb-0">
                      No hotels found for this search.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      window.FLIGHT_API_URL = window.FLIGHT_API_URL || "/api/flights";
      window.HOTEL_API_URL = window.HOTEL_API_URL || "/api/hotels";
    </script>
    <script src="js/airport-data.js"></script>
    <script src="js/hotel-filters.js"></script>
    <script src="js/hotel-list.js"></script>
    <script src="js/planner-shared.js"></script>
    <script src="js/planner-results.js"></script>
  </body>
</html>
