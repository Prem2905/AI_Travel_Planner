<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Results | AI TRAVEL PLANNER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="results-page">
    <nav
      class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm"
      id="mainNav"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">AI TRAVEL PLANNER</a>
        <a class="btn btn-outline-light btn-sm me-2" href="index.html#flights"
          >Back to flights</a
        >
        <a class="btn btn-outline-light btn-sm" href="index.html#hotels"
          >Modify Search</a
        >
      </div>
    </nav>

    <main class="py-5 mt-5">
      <div class="container py-4">
        <div
          class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4"
        >
          <div>
            <span class="badge text-bg-light border mb-2">Hotel Results</span>
            <h1 class="section-title h2 mb-2">Available stays</h1>
            <p class="text-secondary mb-0" id="hotelResultsSummary">
              Preparing your search…
            </p>
          </div>
        </div>

        <div
          id="hotelResultsAlert"
          class="alert alert-danger d-none"
          role="alert"
        ></div>

        <div
          id="hotelResultsFilters"
          class="card border-0 shadow-sm p-3 mb-3 d-none"
          aria-label="Hotel filters"
        ></div>

        <div id="hotelResultsLoading" class="card border-0 shadow-sm p-4 mb-4">
          <div class="d-flex align-items-center gap-3">
            <div
              class="spinner-border text-accent"
              role="status"
              aria-hidden="true"
            ></div>
            <div>
              <strong>Searching live rates</strong>
              <p class="small text-secondary mb-0">
                Contacting hotel provider, please wait…
              </p>
            </div>
          </div>
        </div>

        <div
          id="hotelResultsEmpty"
          class="alert alert-info d-none"
          role="status"
        >
          No hotels match your filters. Try adjusting price, rating, or sort
          options.
        </div>

        <div id="hotelResultsList" class="list-group list-group-flush"></div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      window.HOTEL_API_URL = window.HOTEL_API_URL || "/api/hotels";
    </script>
    <script src="js/hotel-filters.js"></script>
    <script src="js/hotel-list.js"></script>
    <script src="js/hotel-results.js"></script>
  </body>
</html>
